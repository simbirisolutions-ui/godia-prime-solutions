name = "godia-prime-solutions"
main = "src/index.js"
compatibility_date = "2026-09-23"

[vars]
APP_NAME = "GODIA PRIME SOLUTIONS"

[[d1_databases]]
binding = "DB"
database_name = "godia-prime-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "godia-prime-product-images"

[assets]
directory = "./public"
binding = "ASSETS"
