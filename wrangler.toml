name = "godiaprimebussiness"
main = "src/index.js"
compatibility_date = "2026-09-23"

[vars]
APP_NAME = "GODIA PRIME SOLUTIONS"

[[d1_databases]]
binding = "DB"
database_name = "godia-prime-connect-db"
database_id = "c549b601-25e8-48f1-a2a5-e83127cc2302"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "godia-product-images"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "godia-assets"

[assets]
directory = "./public"
